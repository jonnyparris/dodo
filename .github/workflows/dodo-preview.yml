name: dodo-preview

# Deploy a branch to the `dodo-preview` worker on
# https://dodo-preview.jonnyparris.club so changes can be validated before
# merging to main and redeploying prod.
#
# Workers Builds (Cloudflare's auto-build-on-push) rejects the `experimental`
# compat flag (error 10021), so previews are deployed from GitHub Actions
# with `wrangler deploy` — which accepts the flag fine (same path as manual
# prod deploys).
#
# Secrets required on the repo:
#   CLOUDFLARE_API_TOKEN — API token with Workers Scripts Write + Workers
#     Routes Write + Access Apps and Policies Write on the account/zone.
#   CLOUDFLARE_ACCOUNT_ID — the account id (also set as a var in the config).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to deploy as preview
        required: true
        default: main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  # The deploy below ships the PR head to a shared preview worker that binds
  # the same R2 buckets, Durable Object namespaces, and secrets as prod, so it
  # must not run before the branch passes CI. GitHub Actions cannot express
  # `needs` across separate workflow files, and dodo-verify.yml checks out the
  # PR merge ref while the deploy below checks out the head sha, so the verify
  # gate is duplicated here to test the exact ref that ships.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (Biome)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Typecheck smoke (in-isolate tsc tool)
        run: npm run test:typecheck-smoke

  deploy-preview:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Checkout needs contents:read. The comment step posts to the PR via
      # github-script; GitHub gates issue comments on a pull request behind
      # the pull-requests scope, so grant both write scopes the endpoint
      # accepts. The repo's default workflow token is read-only, so without
      # these the comment step 403s with "Resource not accessible by
      # integration".
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Deploy preview
        run: npx wrangler deploy --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = "https://dodo-preview.jonnyparris.club";
            const body = `Preview deployed: ${url}\n\nAccess-gated (same policies as prod). Load it in a Browser Run session with the Dodo service token to verify UI changes.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes("Preview deployed:"));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }