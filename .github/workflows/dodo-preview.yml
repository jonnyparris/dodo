name: dodo-preview

# Deploy a ref to the `dodo-preview` worker on
# https://dodo-preview.jonnyparris.club so changes can be validated before
# merging to main and redeploying prod.
#
# Workers Builds (Cloudflare's auto-build-on-push) rejects the `experimental`
# compat flag (error 10021), so previews are deployed from GitHub Actions
# with `wrangler deploy` — which accepts the flag fine (same path as manual
# prod deploys).
#
# Secrets required on the repo:
#   CLOUDFLARE_API_TOKEN — API token with Workers Scripts Write + Workers
#     Routes Write + Access Apps and Policies Write on the account/zone.
#   CLOUDFLARE_ACCOUNT_ID — the account id (also set as a var in the config).
#
# Deploys run on explicit `workflow_dispatch` only. This workflow previously
# also ran on `pull_request`: GitHub runs a pull_request workflow from the
# pull request's own copy of the file (the merge commit), and the checkout used
# the head commit, so any unmerged branch that edited this file or
# `wrangler.preview.jsonc` reconfigured the live `dodo-preview` worker on every
# push — its bindings, vars and triggers, including re-binding the production
# R2 buckets (`dodo-workspaces`, `dodo-fork-snapshots`) that the preview config
# is meant to stay detached from. Deploying a ref to the shared preview worker
# is now a deliberate action, never a side effect of pushing to a branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to deploy as preview
        required: true
        default: main

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Deploy preview
        run: npx wrangler deploy --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
