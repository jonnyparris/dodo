name: dodo-preview

# Deploy a branch to the `dodo-preview` worker on
# https://dodo-preview.jonnyparris.club so changes can be validated before
# merging to main and redeploying prod.
#
# Workers Builds (Cloudflare's auto-build-on-push) rejects the `experimental`
# compat flag (error 10021), so previews are deployed from GitHub Actions
# with `wrangler deploy` — which accepts the flag fine (same path as manual
# prod deploys).
#
# Secrets required on the repo:
#   CLOUDFLARE_API_TOKEN — API token with Workers Scripts Write + Workers
#     Routes Write + Access Apps and Policies Write on the account/zone.
#   CLOUDFLARE_ACCOUNT_ID — the account id (also set as a var in the config).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to deploy as preview
        required: true
        default: main
      force:
        description: Deploy even if a pull request holds the preview-lock label
        type: boolean
        default: false
  pull_request:
    branches:
      - main
    # `labeled` lets a PR claim the preview: adding the `preview-lock` label
    # deploys that PR's head and holds the slot (see "Check preview lock").
    types: [opened, synchronize, reopened, labeled]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only the preview-lock label triggers a run; other labels are noise.
    if: github.event.action != 'labeled' || github.event.label.name == 'preview-lock'
    # dodo-preview is one worker, so deploys must not interleave. Runs queue
    # instead of racing. GitHub keeps one pending run per group, so a newer
    # push cancels an older *pending* one (it would have been replaced anyway).
    concurrency:
      group: dodo-preview
      cancel-in-progress: false
    # The repo's default workflow token is read-only, so the "Comment preview
    # URL on PR" step needs an explicit grant to reach the issues REST
    # endpoints (REST issue comments cover pull requests too).
    permissions:
      contents: read
      issues: write
      pull-requests: write
      # The preview's current owner is recorded as a GitHub deployment
      # (environment `dodo-preview`), so the next run knows whose build it
      # replaces.
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check preview lock
        # One preview slot is shared by every PR. A PR labelled `preview-lock`
        # holds it: other PRs' pushes skip the deploy (the check stays green
        # and the PR gets a comment) until the label is removed. Remove the
        # label when your live check is done.
        id: lock
        uses: actions/github-script@v7
        with:
          script: |
            const thisPr = context.payload.pull_request?.number ?? null;
            const force = context.payload.inputs?.force === true || context.payload.inputs?.force === "true";
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const holders = prs
              .filter((pr) => pr.labels.some((l) => l.name === "preview-lock"))
              .map((pr) => pr.number);
            let deploy = true;
            let holder = "";
            if (holders.length > 0 && !holders.includes(thisPr)) {
              if (force) {
                core.warning(`Forced deploy over preview-lock held by #${holders.join(", #")}`);
              } else {
                deploy = false;
                holder = String(holders[0]);
                core.notice(`Preview not deployed: #${holders.join(", #")} holds the preview-lock label.`);
              }
            }
            if (holders.length > 1) {
              core.warning(`Several PRs hold preview-lock (#${holders.join(", #")}); the last one deployed wins.`);
            }
            core.setOutput("deploy", String(deploy));
            core.setOutput("holder", holder);
      - name: Comment that the preview is locked
        if: steps.lock.outputs.deploy != 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          HOLDER: ${{ steps.lock.outputs.holder }}
        with:
          script: |
            const marker = "<!-- dodo-preview -->";
            const sha = context.payload.pull_request.head.sha;
            const body = `${marker}\nPreview not deployed: #${process.env.HOLDER} holds the \`preview-lock\` label, so https://dodo-preview.jonnyparris.club keeps serving its build.\n\nThis push (\`${sha.slice(0, 7)}\`) was skipped. Re-run the deploy-preview job after the label is removed, or add \`preview-lock\` here once it is free.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && (c.body.includes(marker) || c.body.includes("Preview deployed:")));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - name: Guard against production bindings
        if: steps.lock.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          cfg=wrangler.preview.jsonc
          test -f "$cfg" || { echo "::error::$cfg not found"; exit 1; }
          fail=0
          if grep -nE '"bucket_name"[[:space:]]*:[[:space:]]*"(dodo-workspaces|dodo-fork-snapshots)"' "$cfg"; then
            echo "::error file=$cfg::$cfg binds a production R2 bucket to the preview worker"
            fail=1
          fi
          # Empty `"crons": []` is required (it clears the deployed schedule);
          # any non-empty list is refused. Newlines are flattened so a
          # multi-line array is caught too.
          if tr -d '\n' < "$cfg" | grep -qE '"crons"[[:space:]]*:[[:space:]]*\[[[:space:]]*"'; then
            echo "::error file=$cfg::$cfg declares a cron trigger; the preview worker must not run scheduled work"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Refusing to deploy: the preview worker must stay detached from production storage and schedules."
            exit 1
          fi
      - name: Setup Node
        if: steps.lock.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: steps.lock.outputs.deploy == 'true'
        run: npm ci
      - name: Find the build being replaced
        # Read before deploying: the latest `dodo-preview` deployment is the
        # build this run is about to overwrite. Deploys made by hand with
        # wrangler (not through this workflow) are not recorded here.
        if: steps.lock.outputs.deploy == 'true'
        id: previous
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: "dodo-preview",
              per_page: 1,
            });
            const prev = data[0];
            let payload = prev?.payload ?? {};
            if (typeof payload === "string") {
              try { payload = JSON.parse(payload); } catch { payload = {}; }
            }
            core.setOutput("pr", payload.pr ? String(payload.pr) : "");
            core.setOutput("sha", prev?.sha ?? "");
      - name: Deploy preview
        if: steps.lock.outputs.deploy == 'true'
        run: npx wrangler deploy --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record the preview owner
        if: steps.lock.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require("child_process");
            const sha = execSync("git rev-parse HEAD").toString().trim();
            const pr = context.payload.pull_request?.number ?? null;
            const { data: dep } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: "dodo-preview",
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              description: pr ? `PR #${pr}` : `manual: ${context.payload.inputs?.ref ?? sha}`,
              payload: { pr, sha },
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.id,
              state: "success",
              environment_url: "https://dodo-preview.jonnyparris.club",
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Comment preview URL on PR, tell the replaced PR
        # Best-effort: the job grants issues/pull-requests write above, but a
        # comment failure (token scope, API blip) must not colour the
        # deploy-preview check red - the check reports whether the preview
        # worker deployed.
        if: steps.lock.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PREV_PR: ${{ steps.previous.outputs.pr }}
          PREV_SHA: ${{ steps.previous.outputs.sha }}
        with:
          script: |
            const { execSync } = require("child_process");
            const url = "https://dodo-preview.jonnyparris.club";
            const marker = "<!-- dodo-preview -->";
            const { owner, repo } = context.repo;
            const sha = execSync("git rev-parse HEAD").toString().trim();
            const short = sha.slice(0, 7);
            const thisPr = context.payload.pull_request?.number ?? null;
            const prevPr = process.env.PREV_PR ? Number(process.env.PREV_PR) : null;
            const prevSha = process.env.PREV_SHA || "";
            const source = thisPr ? `#${thisPr}` : `\`${context.payload.inputs?.ref ?? short}\` (manual run)`;
            const replaced = prevSha && prevSha !== sha
              ? `\n\nReplaced \`${prevSha.slice(0, 7)}\`${prevPr ? ` from #${prevPr}` : ""}.`
              : "";

            async function upsert(issue, body) {
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: issue, per_page: 100 });
              const existing = comments.find((c) => c.body && (c.body.includes(marker) || c.body.includes("Preview deployed:")));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue, body });
              }
            }

            if (thisPr) {
              await upsert(thisPr, `${marker}\nPreview deployed: ${url}\n\nServes \`${short}\` from this PR. Access-gated (same policies as prod). Load it in a Browser Run session with the Dodo service token to verify UI changes.\n\nThe preview is shared: the next PR push replaces this build, and you will get a comment here when it does. Add the \`preview-lock\` label to hold it during a live check, and remove the label when you are done.${replaced}`);
            }

            // Tell the PR whose build was just replaced, so a pending live
            // check there does not silently test someone else's code.
            if (prevPr && prevPr !== thisPr && prevSha !== sha) {
              const { data: prev } = await github.rest.pulls.get({ owner, repo, pull_number: prevPr });
              if (prev.state === "open") {
                await upsert(prevPr, `${marker}\nPreview replaced: ${url} now serves \`${short}\` from ${source}, not this PR's \`${prevSha.slice(0, 7)}\`.\n\nA live check on this PR started before the replacement is no longer testing this branch. Re-run this PR's deploy-preview job to take the preview back, or add the \`preview-lock\` label to deploy it and hold it.`);
              }
            }
